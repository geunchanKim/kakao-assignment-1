<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Todo App - Weekly</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Task Manager</h1>
      <p class="app-subtitle">주간 일정을 관리하며 생산성을 높여보세요.</p>
    </header>

    <div class="weekly-calendar">
      <div class="calendar-control">
        <button id="prev-week-btn" class="nav-btn" aria-label="이전 주">&#10094;</button>
        <h2 id="month-display" class="month-title">2026년 05월</h2>
        <button id="next-week-btn" class="nav-btn" aria-label="다음 주">&#10095;</button>
      </div>
      
      <div id="days-container" class="days-container"></div>
    </div>

    <form id="todo-form" class="todo-form">
      <input type="text" id="todo-input" placeholder="선택된 날짜에 새 할 일 추가..." autocomplete="off">
      <button type="submit" id="add-button">추가</button>
    </form>

    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="active">진행 중</button>
      <button class="filter-btn" data-filter="completed">완료</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
